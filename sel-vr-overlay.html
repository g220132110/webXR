<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEL 社會情緒學習 VR（超穩定版）</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
    }

    /* UI 疊加層 */
    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    /* 標題區 */
    .title-box {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 62, 80, 0.9);
      color: white;
      padding: 20px 40px;
      border-radius: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      line-height: 1.6;
      max-width: 80%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 按鈕區 */
    .buttons-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90%;
    }

    .vr-button {
      background: #FF6B6B;
      color: white;
      padding: 25px 35px;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
      min-width: 200px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: none;
    }

    .vr-button:active {
      transform: scale(0.95);
    }

    .vr-button.green {
      background: #51CF66;
    }

    .vr-button.blue {
      background: #4A90E2;
    }

    .vr-button.orange {
      background: #FF9966;
    }

    .vr-button.cyan {
      background: #5DADE2;
    }

    .vr-button.red {
      background: #E74C3C;
    }

    .vr-button.emerald {
      background: #2ECC71;
    }

    .vr-button.coral {
      background: #FF7043;
    }

    .vr-button.sky {
      background: #42A5F5;
    }

    .vr-button.purple {
      background: #9B59B6;
    }

    /* 提示區 */
    .hint-box {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(52, 73, 94, 0.8);
      color: white;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      text-align: center;
      max-width: 80%;
    }

    .hint-box.warning {
      background: rgba(231, 76, 60, 0.9);
      animation: fadeInOut 3s;
    }

    .hint-box.info {
      background: rgba(192, 57, 43, 0.9);
    }

    /* 呼吸圓圈文字 */
    .breath-text {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 22px;
      background: rgba(44, 62, 80, 0.7);
      padding: 15px 30px;
      border-radius: 10px;
    }

    /* 結尾文字 */
    .ending-text {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      color: #FFD700;
      font-size: 20px;
      text-align: center;
      line-height: 1.8;
      max-width: 80%;
    }

    .thanks-text {
      position: absolute;
      bottom: 25%;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 18px;
    }

    /* 淡入淡出動畫 */
    @keyframes fadeInOut {
      0%, 100% { opacity: 0; }
      20%, 80% { opacity: 1; }
    }

    /* 隱藏類 */
    .hidden {
      display: none !important;
    }

    /* VR 模式下隱藏 UI */
    .a-enter-vr .vr-mode-hide {
      display: none;
    }
  </style>
</head>
<body>
  <!-- UI 疊加層 -->
  <div id="ui-overlay">
    <!-- 場景 1: 自我覺察 -->
    <div id="ui-scene-1" class="scene-ui">
      <div class="title-box">
        坐在這裡的你，<br>現在心裡正發生什麼？
      </div>
      <div class="buttons-container">
        <button class="vr-button" onclick="selectOption(1, 'a')">
          我說不上來，<br>但有點不舒服
        </button>
        <button class="vr-button green" onclick="selectOption(1, 'b')">
          我還好，<br>只是有點累
        </button>
      </div>
      <div class="hint-box">
        點擊按鈕選擇<br>
        <small style="color: #FFD700;">（VR 模式下用視線注視 1.5 秒）</small>
      </div>
    </div>

    <!-- 場景 2: 自我管理 -->
    <div id="ui-scene-2" class="scene-ui hidden">
      <div class="title-box">
        先讓身體慢一點，<br>不用急著想清楚。
      </div>
      <div class="breath-text">
        深呼吸...慢慢來
      </div>
      <div class="buttons-container">
        <button class="vr-button blue hidden" id="btn-scene-2" onclick="selectOption(2, 'continue')">
          我覺得好一些了
        </button>
      </div>
    </div>

    <!-- 場景 3: 社會覺察 -->
    <div id="ui-scene-3" class="scene-ui hidden">
      <div class="title-box">
        剛剛有人撞到你卻沒道歉，<br>你覺得是？
      </div>
      <div class="buttons-container">
        <button class="vr-button orange" onclick="selectOption(3, 'a')">
          他針對我，<br>真沒禮貌！
        </button>
        <button class="vr-button cyan" onclick="selectOption(3, 'b')">
          也許他只是<br>心裡也不好受
        </button>
      </div>
      <div class="hint-box warning hidden" id="hint-3">
        換個角度再看看...
      </div>
    </div>

    <!-- 場景 4: 人際技巧 -->
    <div id="ui-scene-4" class="scene-ui hidden">
      <div class="title-box">
        朋友看起來在等你開口，<br>你想怎麼說？
      </div>
      <div class="buttons-container">
        <button class="vr-button red" onclick="selectOption(4, 'a')">
          不要吵，<br>我現在很煩。
        </button>
        <button class="vr-button emerald" onclick="selectOption(4, 'b')">
          我今天不太在狀態，<br>可以陪我坐一下嗎？
        </button>
      </div>
      <div class="hint-box warning hidden" id="hint-4">
        有時候沉默比爆炸更安全
      </div>
    </div>

    <!-- 場景 5: 負責任的決策 -->
    <div id="ui-scene-5" class="scene-ui hidden">
      <div class="title-box">
        訊息已經打好，<br>正想按送出。你會？
      </div>
      <div class="buttons-container" id="buttons-5">
        <button class="vr-button coral" onclick="selectOption(5, 'a')">
          立刻送出，<br>讓對方知道我的不滿！
        </button>
        <button class="vr-button sky" onclick="selectOption(5, 'b')">
          先存成草稿，<br>等心情穩了再說。
        </button>
      </div>
      <div class="hint-box info hidden" id="consequence-5">
        訊息送出後，關係變得更糟了...<br><br>
        <span style="color: #FFD700;">延遲，不是逃避，<br>是成熟的一種形式。</span>
      </div>
    </div>

    <!-- 場景 6: 結尾 -->
    <div id="ui-scene-6" class="scene-ui hidden">
      <div class="title-box" style="font-size: 26px;">
        你已經走完今天的一圈。
      </div>
      <div class="ending-text">
        練習不是變完美，<br>而是變靠近自己。
      </div>
      <div class="buttons-container">
        <button class="vr-button purple" onclick="location.reload()">
          重新開始
        </button>
      </div>
      <div class="thanks-text">
        感謝你的參與
      </div>
    </div>
  </div>

  <!-- A-Frame VR 場景（純背景和 3D 元素） -->
  <a-scene>
    <a-entity id="rig" position="0 1.6 0">
      <a-camera>
        <a-cursor
          fuse="true"
          fuse-timeout="1500"
          raycaster="objects: .clickable">
          <a-ring color="#ffffff" radius-inner="0.02" radius-outer="0.03"></a-ring>
          <a-circle color="#00ff00" radius="0.02" opacity="0"
            animation__fuse="property: opacity; from: 0; to: 0.8; dur: 1500; startEvents: fusing"
            animation__reset="property: opacity; to: 0; dur: 100; startEvents: click"></a-circle>
        </a-cursor>
      </a-camera>
    </a-entity>

    <!-- 場景 1 背景 -->
    <a-entity id="vr-scene-1" visible="true">
      <a-sky color="#FFE5B4"></a-sky>
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      
      <!-- VR 模式下的可點擊區域（透明） -->
      <a-box class="clickable" position="-1.3 1.5 -3" width="1.5" height="0.8" depth="0.1" 
        color="#FF6B6B" opacity="0.3" id="vr-btn-1a"></a-box>
      <a-box class="clickable" position="1.3 1.5 -3" width="1.5" height="0.8" depth="0.1" 
        color="#51CF66" opacity="0.3" id="vr-btn-1b"></a-box>
    </a-entity>

    <!-- 場景 2 背景 -->
    <a-entity id="vr-scene-2" visible="false">
      <a-sky color="#B3D9FF"></a-sky>
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      
      <a-circle radius="0.4" position="0 1.5 -3" color="#4ECDC4" opacity="0.8"
        animation__breathe="property: scale; from: 1 1 1; to: 1.8 1.8 1.8; dir: alternate; dur: 3000; loop: true; easing: easeInOutQuad"></a-circle>
      
      <a-box class="clickable" position="0 0.8 -3" width="2" height="0.8" depth="0.1" 
        color="#4A90E2" opacity="0.3" id="vr-btn-2" visible="false"></a-box>
    </a-entity>

    <!-- 場景 3 背景 -->
    <a-entity id="vr-scene-3" visible="false">
      <a-sky color="#D5E5F2"></a-sky>
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      
      <a-box class="clickable" position="-1.3 1.5 -3" width="1.5" height="0.8" depth="0.1" 
        color="#FF9966" opacity="0.3" id="vr-btn-3a"></a-box>
      <a-box class="clickable" position="1.3 1.5 -3" width="1.5" height="0.8" depth="0.1" 
        color="#5DADE2" opacity="0.3" id="vr-btn-3b"></a-box>
    </a-entity>

    <!-- 場景 4 背景 -->
    <a-entity id="vr-scene-4" visible="false">
      <a-sky color="#F5DEB3"></a-sky>
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      
      <a-box class="clickable" position="-1.3 1.5 -3" width="1.5" height="0.8" depth="0.1" 
        color="#E74C3C" opacity="0.3" id="vr-btn-4a"></a-box>
      <a-box class="clickable" position="1.3 1.5 -3" width="1.5" height="0.8" depth="0.1" 
        color="#2ECC71" opacity="0.3" id="vr-btn-4b"></a-box>
    </a-entity>

    <!-- 場景 5 背景 -->
    <a-entity id="vr-scene-5" visible="false">
      <a-sky color="#FFDAB9"></a-sky>
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      
      <a-box class="clickable" position="-1.3 1.5 -3" width="1.5" height="0.8" depth="0.1" 
        color="#FF7043" opacity="0.3" id="vr-btn-5a"></a-box>
      <a-box class="clickable" position="1.3 1.5 -3" width="1.5" height="0.8" depth="0.1" 
        color="#42A5F5" opacity="0.3" id="vr-btn-5b"></a-box>
    </a-entity>

    <!-- 場景 6 背景 -->
    <a-entity id="vr-scene-6" visible="false">
      <a-sky color="#FFE66D"></a-sky>
      <a-entity light="type: ambient; intensity: 1"></a-entity>
      
      <a-box class="clickable" position="0 1.2 -3" width="2" height="0.8" depth="0.1" 
        color="#9B59B6" opacity="0.3" id="vr-btn-6"></a-box>
    </a-entity>
  </a-scene>

  <script>
    let currentScene = 1;

    // 場景切換
    function switchScene(toScene) {
      // 隱藏所有 UI
      document.querySelectorAll('.scene-ui').forEach(el => el.classList.add('hidden'));
      // 顯示目標 UI
      document.querySelector(`#ui-scene-${toScene}`).classList.remove('hidden');
      
      // 隱藏所有 VR 場景
      for (let i = 1; i <= 6; i++) {
        const vrScene = document.querySelector(`#vr-scene-${i}`);
        if (vrScene) vrScene.setAttribute('visible', false);
      }
      // 顯示目標 VR 場景
      const targetVrScene = document.querySelector(`#vr-scene-${toScene}`);
      if (targetVrScene) targetVrScene.setAttribute('visible', true);
      
      currentScene = toScene;
    }

    // 選項處理
    function selectOption(scene, option) {
      if (scene === 1) {
        switchScene(2);
      } else if (scene === 2) {
        switchScene(3);
      } else if (scene === 3) {
        if (option === 'a') {
          const hint = document.querySelector('#hint-3');
          hint.classList.remove('hidden');
          setTimeout(() => hint.classList.add('hidden'), 2500);
        } else {
          switchScene(4);
        }
      } else if (scene === 4) {
        if (option === 'a') {
          const hint = document.querySelector('#hint-4');
          hint.classList.remove('hidden');
          setTimeout(() => hint.classList.add('hidden'), 3000);
        } else {
          switchScene(5);
        }
      } else if (scene === 5) {
        if (option === 'a') {
          const buttons = document.querySelector('#buttons-5');
          const consequence = document.querySelector('#consequence-5');
          buttons.classList.add('hidden');
          consequence.classList.remove('hidden');
          setTimeout(() => {
            consequence.classList.add('hidden');
            buttons.classList.remove('hidden');
          }, 4000);
        } else {
          switchScene(6);
        }
      }
    }

    // VR 按鈕點擊事件
    setTimeout(() => {
      document.querySelector('#vr-btn-1a').addEventListener('click', () => selectOption(1, 'a'));
      document.querySelector('#vr-btn-1b').addEventListener('click', () => selectOption(1, 'b'));
      document.querySelector('#vr-btn-2').addEventListener('click', () => selectOption(2, 'continue'));
      document.querySelector('#vr-btn-3a').addEventListener('click', () => selectOption(3, 'a'));
      document.querySelector('#vr-btn-3b').addEventListener('click', () => selectOption(3, 'b'));
      document.querySelector('#vr-btn-4a').addEventListener('click', () => selectOption(4, 'a'));
      document.querySelector('#vr-btn-4b').addEventListener('click', () => selectOption(4, 'b'));
      document.querySelector('#vr-btn-5a').addEventListener('click', () => selectOption(5, 'a'));
      document.querySelector('#vr-btn-5b').addEventListener('click', () => selectOption(5, 'b'));
      document.querySelector('#vr-btn-6').addEventListener('click', () => location.reload());
    }, 1000);

    // 場景 2 按鈕延遲顯示
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.attributeName === 'visible') {
          const scene2 = document.querySelector('#vr-scene-2');
          if (scene2 && scene2.getAttribute('visible') === 'true') {
            setTimeout(() => {
              document.querySelector('#btn-scene-2').classList.remove('hidden');
              document.querySelector('#vr-btn-2').setAttribute('visible', true);
            }, 5000);
          }
        }
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      const scene2 = document.querySelector('#vr-scene-2');
      if (scene2) observer.observe(scene2, { attributes: true });
    });
  </script>
</body>
</html>
