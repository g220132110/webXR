<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEL VR 體驗 - 進階版（含素材範例）</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <!-- 
    ⚠️ 此為進階版範例，展示如何添加真實素材
    需要準備以下檔案：
    - 360 背景圖片（2048x1024 或更高解析度）
    - 音效檔案（MP3 或 WAV 格式）
    
    將素材放在與此 HTML 同目錄，或使用完整 URL
  -->

  <a-scene>
    <!-- 預載素材（Assets） -->
    <a-assets>
      <!-- 360 背景圖片 -->
      <img id="bg-classroom" src="bg_classroom_morning.jpg" crossorigin="anonymous">
      <img id="bg-water" src="bg_table_water.jpg" crossorigin="anonymous">
      <img id="bg-corridor" src="bg_corridor_softblur.jpg" crossorigin="anonymous">
      <img id="bg-stairs" src="bg_stairs_sitting.jpg" crossorigin="anonymous">
      <img id="bg-track" src="bg_track_crossroad.jpg" crossorigin="anonymous">
      <img id="bg-campus" src="bg_campus_sunny.jpg" crossorigin="anonymous">
      
      <!-- 音效檔案 -->
      <audio id="sfx-clock" src="sfx_clock_soft.mp3" preload="auto"></audio>
      <audio id="sfx-breath" src="sfx_slow_breath.mp3" preload="auto"></audio>
      <audio id="sfx-footsteps" src="sfx_footsteps_echo.mp3" preload="auto"></audio>
      <audio id="sfx-air" src="sfx_quiet_air.mp3" preload="auto"></audio>
      <audio id="sfx-wind" src="sfx_wind_soft.mp3" preload="auto"></audio>
      <audio id="sfx-click" src="click.mp3" preload="auto"></audio>
      <audio id="sfx-success" src="ding.mp3" preload="auto"></audio>
    </a-assets>

    <!-- 相機與凝視游標 -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera>
        <a-cursor
          id="cursor"
          fuse="true"
          fuse-timeout="1500"
          raycaster="objects: .clickable">
          <a-ring id="cursor-ring" color="#ffffff" radius-inner="0.02" radius-outer="0.03"></a-ring>
          <a-plane id="cursor-fuse" color="#00ff00" width="0.08" height="0.08" opacity="0"
            animation__fuse="property: opacity; from: 0; to: 0.6; dur: 1500; startEvents: fusing"
            animation__reset="property: opacity; to: 0; dur: 100; startEvents: click"></a-plane>
        </a-cursor>
      </a-camera>
    </a-entity>

    <!-- 場景 1: 自我覺察 -->
    <a-entity id="scene-1" visible="true">
      <!-- 360 背景圖片（如果圖片不存在會顯示錯誤，可先用純色測試） -->
      <a-sky src="#bg-classroom" rotation="0 -90 0"></a-sky>
      <!-- 備用：如果沒有圖片，取消註解下面這行 -->
      <!-- <a-sky color="#FFE5B4"></a-sky> -->
      
      <!-- 環境音效 -->
      <a-entity sound="src: #sfx-clock; autoplay: true; loop: true; volume: 0.3"></a-entity>
      
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      
      <a-text
        value="坐在這裡的你，\n現在心裡正發生什麼？"
        align="center"
        position="0 2.2 -3"
        width="4.5"
        color="#2C3E50"></a-text>
      
      <!-- 按鈕加入點擊音效 -->
      <a-entity position="-1.2 1.3 -3" class="clickable" id="scene1-btn-a">
        <a-box width="1.8" height="0.5" depth="0.1" color="#FF6B6B" opacity="0.9"
          animation__hover="property: scale; from: 1 1 1; to: 1.1 1.1 1.1; dur: 200; startEvents: mouseenter"
          animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
          sound="on: click; src: #sfx-click; volume: 0.5"></a-box>
        <a-text value="我說不上來，\n但有點不舒服" align="center" position="0 0 0.06" width="1.6" color="#FFFFFF"></a-text>
      </a-entity>
      
      <a-entity position="1.2 1.3 -3" class="clickable" id="scene1-btn-b">
        <a-box width="1.8" height="0.5" depth="0.1" color="#51CF66" opacity="0.9"
          animation__hover="property: scale; from: 1 1 1; to: 1.1 1.1 1.1; dur: 200; startEvents: mouseenter"
          animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
          sound="on: click; src: #sfx-click; volume: 0.5"></a-box>
        <a-text value="我還好，\n只是有點累" align="center" position="0 0 0.06" width="1.6" color="#FFFFFF"></a-text>
      </a-entity>

      <a-text
        value="用視線注視選項 1.5 秒即可選擇"
        align="center"
        position="0 0.5 -3"
        width="3"
        color="#7F8C8D"
        opacity="0.7"></a-text>
    </a-entity>

    <!-- 場景 2: 自我管理 -->
    <a-entity id="scene-2" visible="false">
      <a-sky src="#bg-water" rotation="0 -90 0"></a-sky>
      <!-- 備用 -->
      <!-- <a-sky color="#B3D9FF"></a-sky> -->
      
      <!-- 呼吸音效 -->
      <a-entity sound="src: #sfx-breath; autoplay: true; loop: true; volume: 0.4"></a-entity>
      
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      
      <a-text
        value="先讓身體慢一點，\n不用急著想清楚。"
        align="center"
        position="0 2.2 -3"
        width="4.5"
        color="#2C3E50"></a-text>
      
      <a-circle
        id="breath-circle"
        radius="0.3"
        position="0 1.5 -3"
        color="#4ECDC4"
        opacity="0.7"
        animation__breathe="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; dur: 3000; loop: true; easing: easeInOutQuad"></a-circle>
      
      <a-text
        value="深呼吸...慢慢來"
        align="center"
        position="0 0.9 -3"
        width="2.5"
        color="#2C3E50"></a-text>
      
      <a-entity position="0 0.3 -3" class="clickable" id="scene2-btn" visible="false">
        <a-box width="2" height="0.5" depth="0.1" color="#4A90E2" opacity="0.9"
          animation__hover="property: scale; from: 1 1 1; to: 1.1 1.1 1.1; dur: 200; startEvents: mouseenter"
          animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
          sound="on: click; src: #sfx-success; volume: 0.6"></a-box>
        <a-text value="我覺得好一些了" align="center" position="0 0 0.06" width="1.8" color="#FFFFFF"></a-text>
      </a-entity>
    </a-entity>

    <!-- 其他場景省略，結構相同... -->
    <!-- 可參考基礎版完整實作 -->

  </a-scene>

  <script>
    // 場景切換函數（帶音效淡出淡入）
    function switchScene(fromScene, toScene) {
      const from = document.querySelector(`#scene-${fromScene}`);
      const to = document.querySelector(`#scene-${toScene}`);
      
      // 停止前一個場景的所有音效
      if (from) {
        const sounds = from.querySelectorAll('[sound]');
        sounds.forEach(s => {
          const soundComp = s.components.sound;
          if (soundComp) soundComp.stopSound();
        });
        from.setAttribute('visible', false);
      }
      
      // 顯示新場景並播放音效
      if (to) {
        to.setAttribute('visible', true);
        const sounds = to.querySelectorAll('[sound]');
        sounds.forEach(s => {
          const soundComp = s.components.sound;
          if (soundComp && soundComp.data.autoplay) {
            setTimeout(() => soundComp.playSound(), 300);
          }
        });
      }
    }

    // 事件監聽器
    document.querySelector('#scene1-btn-a').addEventListener('click', () => {
      switchScene(1, 2);
    });
    document.querySelector('#scene1-btn-b').addEventListener('click', () => {
      switchScene(1, 2);
    });

    document.querySelector('#scene2-btn').addEventListener('click', () => {
      switchScene(2, 3);
    });

    // 場景2按鈕延遲顯示
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.attributeName === 'visible') {
          const scene2 = document.querySelector('#scene-2');
          if (scene2.getAttribute('visible') === 'true') {
            setTimeout(() => {
              const btn = document.querySelector('#scene2-btn');
              if (btn && scene2.getAttribute('visible') === 'true') {
                btn.setAttribute('visible', true);
                btn.setAttribute('animation', 'property: opacity; from: 0; to: 1; dur: 800');
              }
            }, 5000);
          }
        }
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      observer.observe(document.querySelector('#scene-2'), { attributes: true });
      
      // 處理素材載入失敗
      const assets = document.querySelector('a-assets');
      assets.addEventListener('error', (e) => {
        console.warn('素材載入失敗:', e.target.id, '將使用純色背景');
      });
    });
  </script>

  <!-- 使用說明 -->
  <!--
    📝 素材準備指南：
    
    1. 360 背景圖片
       - 格式：JPG 或 PNG
       - 解析度：建議 2048x1024 以上（等距圓柱投影）
       - 可用免費資源：
         * Pixabay (https://pixabay.com/photos/search/360/)
         * Unsplash 360 (搜尋 "360 panorama")
         * Google Street View 截圖
    
    2. 音效檔案
       - 格式：MP3（相容性最好）或 WAV
       - 音量：建議 -3dB 到 -6dB（避免過大）
       - 可用免費資源：
         * Freesound (https://freesound.org/)
         * YouTube Audio Library
         * Zapsplat (https://www.zapsplat.com/)
    
    3. 檔案命名建議：
       bg_classroom_morning.jpg
       bg_table_water.jpg
       sfx_clock_soft.mp3
       sfx_slow_breath.mp3
       click.mp3
       ding.mp3
    
    4. 資料夾結構：
       project/
       ├── sel-vr-advanced.html（此檔案）
       ├── images/
       │   ├── bg_classroom_morning.jpg
       │   ├── bg_table_water.jpg
       │   └── ...
       └── sounds/
           ├── sfx_clock_soft.mp3
           ├── sfx_slow_breath.mp3
           └── ...
       
       如果使用子資料夾，記得修改 src 路徑：
       src="images/bg_classroom_morning.jpg"
       src="sounds/sfx_clock_soft.mp3"
    
    5. 測試流程：
       - 先用基礎版（純色）確認互動正常
       - 逐步添加一個場景的圖片和音效
       - 確認載入無誤後再添加其他場景
       - 最後在手機上測試效能
  -->
</body>
</html>
